name: PR Validation — Title & Labels

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - synchronize
      - reopened

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title and Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || '';
            const labels = (pr.labels || []).map(l => l.name);

            const allowedLabels = ['feature', 'fix', 'docs', 'refactor'];
            const titleRegex = /^PIXP-\d{4}: \S+/;

            let hasError = false;

            // 1. Validar formato do título: "PIXP-0000: Nome da Task"
            if (!titleRegex.test(title)) {
              core.error(
                `Título inválido: "${title}". O título da PR deve seguir o padrão "PIXP-0000: Nome da Task" (onde 0000 são 4 dígitos numéricos).`
              );
              hasError = true;
            } else {
              core.info(`✓ Título válido: "${title}"`);
            }

            // 2. Validar presença de pelo menos uma das labels obrigatórias
            const matchedLabels = labels.filter(label => allowedLabels.includes(label));
            if (matchedLabels.length === 0) {
              core.error(
                `Nenhuma tag obrigatória encontrada. A PR deve possuir pelo menos uma das seguintes labels: ${allowedLabels.join(', ')}. Labels atuais: [${labels.join(', ') || 'nenhuma'}]`
              );
              hasError = true;
            } else {
              core.info(`✓ Labels válidas encontradas: ${matchedLabels.join(', ')}`);
            }

            if (hasError) {
              core.setFailed('A validação da Pull Request falhou. Verifique o título e as labels.');
            }
