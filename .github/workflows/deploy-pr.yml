name: PR Preview — On-Demand Deploy (@deploy-pr)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: write

jobs:
  deploy-preview:
    name: Deploy PR Preview
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@deploy-pr')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: React to comment and fetch PR details
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            // Adicionar reação de foguete no comentário @deploy-pr
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

            // Buscar dados da branch da Pull Request
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('short_sha', pr.head.sha.substring(0, 7));

      - name: Validate Vercel Secrets
        id: check-secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
          else
            echo "missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment if Secrets are Missing
        if: steps.check-secrets.outputs.missing == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '⚠️ **Não foi possível gerar o ambiente temporário (`@deploy-pr`)**',
                '',
                'As credenciais da Vercel ainda não foram configuradas nos **GitHub Actions Secrets** deste repositório.',
                'Configure os seguintes *Repository Secrets* em `Settings > Secrets and variables > Actions`:',
                '- `VERCEL_TOKEN`',
                '- `VERCEL_ORG_ID`',
                '- `VERCEL_PROJECT_ID`'
              ].join('\n')
            });
            core.setFailed('Secrets da Vercel ausentes no repositório.');

      - name: Checkout PR Branch
        if: steps.check-secrets.outputs.missing == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.head_sha }}

      - name: Setup Node.js
        if: steps.check-secrets.outputs.missing == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        if: steps.check-secrets.outputs.missing == 'false'
        run: npm ci

      - name: Deploy Temporary Environment to Vercel
        if: steps.check-secrets.outputs.missing == 'false'
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          PREVIEW_URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Post Preview URL Comment on PR
        if: steps.check-secrets.outputs.missing == 'false' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.vercel-deploy.outputs.preview_url }}';
            const branch = '${{ steps.pr-info.outputs.head_ref }}';
            const shortSha = '${{ steps.pr-info.outputs.short_sha }}';
            const sender = context.payload.comment.user.login;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🚀 **Ambiente Temporário da PR Disponível!**',
                '',
                `- 🌐 **Link de Preview:** ${previewUrl}`,
                `- 🌿 **Branch:** \`${branch}\` (\`${shortSha}\`)`,
                `- 👤 **Solicitado por:** @${sender}`
              ].join('\n')
            });
