name: Promote — develop -> staging

on:
  workflow_dispatch:
    inputs:
      task_number:
        description: 'Número da Task (4 dígitos para PIXP-0000)'
        required: true
        default: '0000'
        type: string
      task_title:
        description: 'Título da entrega/release'
        required: true
        default: 'Promover alterações de develop para staging'
        type: string
      label:
        description: 'Tag (Label) obrigatória para a PR'
        required: true
        default: 'feature'
        type: choice
        options:
          - feature
          - fix
          - docs
          - refactor

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  promote-to-staging:
    name: Open PR (develop -> staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Build
        run: npm run build

      - name: Create or Update Pull Request (develop -> staging)
        uses: actions/github-script@v7
        with:
          script: |
            const sourceBranch = 'develop';
            const targetBranch = 'staging';
            const rawNum = '${{ inputs.task_number }}'.trim();
            const taskTitle = '${{ inputs.task_title }}'.trim();
            const label = '${{ inputs.label }}'.trim();

            if (!/^\d{4}$/.test(rawNum)) {
              core.setFailed(`O campo task_number ("${rawNum}") deve conter exatamente 4 dígitos numéricos (ex: 0001).`);
              return;
            }

            const prTitle = `PIXP-${rawNum}: ${taskTitle}`;

            // Obter SHA atual da branch develop
            const { data: branchData } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: sourceBranch
            });
            const headSha = branchData.commit.sha;

            // Verificar se já existe PR aberta de develop para staging
            const { data: existingPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${sourceBranch}`,
              base: targetBranch,
              state: 'open'
            });

            let prNumber;
            let prUrl;

            const prBody = [
              '## 📦 Promoção de Ambiente: `develop` → `staging`',
              '',
              `- **Origem:** \`${sourceBranch}\``,
              `- **Destino:** \`${targetBranch}\``,
              `- **Tag aplicada:** \`${label}\``,
              `- **Solicitado manualmente por:** @${context.actor}`,
              '',
              '> 💡 Comente `@deploy-pr` nesta Pull Request caso queira gerar um link temporário de validação antes do merge.'
            ].join('\n');

            if (existingPrs.length > 0) {
              prNumber = existingPrs[0].number;
              prUrl = existingPrs[0].html_url;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                title: prTitle,
                body: prBody
              });
              core.info(`✓ Pull Request existente atualizada: #${prNumber} (${prUrl})`);
            } else {
              const { data: newPr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: sourceBranch,
                base: targetBranch,
                body: prBody
              });
              prNumber = newPr.number;
              prUrl = newPr.html_url;
              core.info(`✓ Nova Pull Request criada: #${prNumber} (${prUrl})`);
            }

            // Adicionar a label obrigatória na PR
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [label]
            });

            // Registrar os 3 checks de código/título como concluídos e o Deploy PR Preview como pendente (aguardando @deploy-pr)
            for (const checkName of ['Validate PR', 'Lint', 'Build']) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: checkName,
                head_sha: headSha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: `${checkName} validado com sucesso`,
                  summary: `Executado e aprovado durante o workflow de promoção (${sourceBranch} -> ${targetBranch}).`
                }
              });
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Deploy PR Preview',
              head_sha: headSha,
              status: 'in_progress',
              output: {
                title: 'Aguardando comando @deploy-pr nos comentários da PR',
                summary: 'Comente `@deploy-pr` na Pull Request para gerar o ambiente temporário e concluir este check.'
              }
            });

            core.summary
              .addHeading('🚀 Pull Request de Promoção Pronta!')
              .addRaw(`A PR **[#${prNumber} — ${prTitle}](${prUrl})** (\`${sourceBranch}\` → \`${targetBranch}\`) está aberta. Comente \`@deploy-pr\` e \`@approve\` para liberar o merge.`)
              .write();
