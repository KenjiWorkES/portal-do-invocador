# Configuração do SonarCloud (SonarQube Cloud) — Portal do Invocador
sonar.organization=kenjiworkes
sonar.projectKey=KenjiWorkES_portal-do-invocador
sonar.projectName=Portal do Invocador
sonar.sourceEncoding=UTF-8

# Diretórios analisados (HTML, CSS, JS e dados públicos)
sonar.sources=src,public

# Exclusões de arquivos gerados e documentação
sonar.exclusions=node_modules/**,dist/**,figma/**,docs/**

# Projeto pedagógico sem suíte de testes unitários:
# Isenta cobertura de testes no Quality Gate para focar em Bugs, Code Smells, Segurança e Duplicação
sonar.coverage.exclusions=**/*
